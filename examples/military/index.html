<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Military symbols</title>
    <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        font: 14px/1.4 system-ui, sans-serif;
      }
      #map {
        position: absolute;
        inset: 0;
      }
      .panel {
        position: absolute;
        top: 12px;
        left: 12px;
        padding: 10px 14px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.25);
        display: grid;
        gap: 6px;
        max-width: calc(100% - 52px);
      }
      .panel output {
        font: 600 15px/1.3 ui-monospace, "Cascadia Mono", Consolas, monospace;
      }
      .panel label {
        color: #444;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div class="panel">
      <output id="grid" aria-live="polite"></output>
      <label>Open your own CoT, KML, KMZ, GPX, CSV or GeoJSON file <input id="file" type="file" /></label>
    </div>
    <script type="module">
      import * as maplet from "../../dist/maplet.js";

      const now = new Date();
      const later = new Date(now.getTime() + 3600000);
      const event = (uid, type, lat, lon, callsign, extra = "") =>
        `<event version="2.0" uid="${uid}" type="${type}" how="h-g-i-g-o" time="${now.toISOString()}" start="${now.toISOString()}" stale="${later.toISOString()}"><point lat="${lat}" lon="${lon}" hae="0" ce="10" le="10"/><detail><contact callsign="${callsign}"/>${extra}</detail></event>`;
      const cot = `<events>${[
        event("u1", "a-f-G-U-C-I", 47.6205, -122.3493, "ALPHA", "<remarks>Holding the hill</remarks>"),
        event("u2", "a-f-G-U-C-A", 47.6097, -122.3331, "BRAVO"),
        event("u3", "a-f-G-U-C-F", 47.5952, -122.3316, "CHARLIE"),
        event("u4", "a-f-G-U-S-M", 47.6062, -122.3165, "DOC"),
        event("u5", "a-h-G-U-C-I", 47.6315, -122.3145, "RED 1"),
        event("u6", "a-h-G-U-C-A", 47.6421, -122.3359, "RED 2"),
        event("u7", "a-n-G-U-C-I", 47.5798, -122.3863, "BLUE WATER"),
        event("u8", "a-u-G", 47.6520, -122.3510, "UNKNOWN"),
        event("u9", "a-f-A-M-F-Q", 47.6, -122.4, "HAWK"),
        event(
          "route",
          "u-d-f",
          47.6097,
          -122.3331,
          "ROUTE GOLD",
          '<link point="47.6097,-122.3331"/><link point="47.6150,-122.3400"/><link point="47.6205,-122.3493"/><strokeColor value="-23296"/><strokeWeight value="4"/>',
        ),
        event("zone", "u-d-c-c", 47.6315, -122.3145, "WATCH", '<shape><ellipse major="600" minor="600" angle="0"/></shape><fillColor value="1442775040"/>'),
      ].join("")}</events>`;

      const map = new maplet.Map({ container: "map", center: [-122.345, 47.615], zoom: 12.5, hash: true });
      map.addControl(new maplet.NavigationControl());
      map.addControl(new maplet.ScaleControl());
      maplet.militarySymbols(map);

      const units = URL.createObjectURL(new Blob([cot], { type: "application/xml" }));
      map.once("styleload").then(() => {
        map.addSource("units", { type: "geojson", data: units, format: "cot" });
        map.addLayer({
          id: "areas",
          type: "fill",
          source: "units",
          filter: ["==", ["geometry-type"], "Polygon"],
          paint: { color: ["coalesce", ["get", "fill"], "#ff0000"], opacity: 0.25 },
        });
        map.addLayer({
          id: "routes",
          type: "line",
          source: "units",
          filter: ["==", ["geometry-type"], "LineString"],
          paint: { color: ["coalesce", ["get", "stroke"], "#ff9900"], width: ["coalesce", ["get", "stroke-width"], 3] },
        });
        map.addLayer({
          id: "symbols",
          type: "symbol",
          source: "units",
          filter: ["has", "sidc"],
          layout: {
            icon: ["concat", "sidc:", ["get", "sidc"]],
            iconAllowOverlap: true,
            optional: true,
            text: ["get", "callsign"],
            offset: [0, 1.1],
            anchor: "top",
            size: 12,
            weight: "bold",
          },
          paint: { haloColor: "#ffffff", haloWidth: 1.5 },
        });
      });

      map.on("click", "symbols", (e) => {
        const f = e.features?.[0];
        if (!f) return;
        const p = f.properties ?? {};
        const grid = maplet.toMgrs(f.geometry.coordinates) ?? "";
        new maplet.Popup()
          .setLngLat(f.geometry.coordinates)
          .setText(`${p.callsign ?? p.uid}  ${p.type}  ${grid}${p.remarks ? `\n${p.remarks}` : ""}`)
          .addTo(map);
      });

      const grid = document.getElementById("grid");
      const show = () => {
        const center = map.getCenter();
        const text = maplet.toMgrs(center, 5);
        grid.textContent = text ? text.replace(/^(\d+\w)(\w\w)(\d{5})(\d{5})$/, "$1 $2 $3 $4") : "Outside MGRS";
      };
      map.on("move", show);
      show();

      document.getElementById("file").addEventListener("change", (e) => {
        const file = e.target.files?.[0];
        if (file) map.getSource("units")?.setData(file);
      });
    </script>
  </body>
</html>
