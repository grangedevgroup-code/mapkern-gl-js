<!doctype html>
<html lang="en" class="maplet-viewer">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Maplet terrain</title>
    <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../viewer.css" />
  </head>
  <body>
    <div id="map"></div>
    <script type="module">
      import { BASEMAPS, createViewer, fileButton, maplet, TERRAIN } from "../viewer.js";

      const params = new URLSearchParams(location.search);
      const tiles = params.get("tiles");
      const elevation = params.get("elevation");

      const { map, terrain, panel } = createViewer({
        basemaps: tiles ? [{ name: "Your tiles", style: maplet.lightStyle({ url: tiles }) }, ...BASEMAPS] : BASEMAPS,
        terrain: elevation ? { type: "dem", url: elevation } : TERRAIN,
        view: "tilted",
        center: [-121.76, 46.85],
        zoom: 10.5,
      });
      map.on("error", (event) => console.warn(event.error.message));

      let fit = Boolean(elevation);
      map.on("sourcedata", (event) => {
        if (!fit || event.sourceId !== "maplet-terrain" || event.kind !== "metadata") return;
        fit = false;
        const bounds = map.getSource("maplet-terrain")?.bounds;
        if (bounds) map.fitBounds(bounds, { padding: 40, maxZoom: 11 });
      });

      panel(
        fileButton("Open elevation file", ".pmtiles,.mbtiles", async (file) => {
          fit = true;
          terrain.setSource({ type: "dem", url: await maplet.openTileFile(file) });
          if (terrain.view === "flat") terrain.setView("tilted");
        }),
      );
      window.map = map;
    </script>
  </body>
</html>
