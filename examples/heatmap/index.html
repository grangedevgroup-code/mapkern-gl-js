<!doctype html>
<html lang="en" class="mapkern-viewer">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Heatmap</title>
    <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../viewer.css" />
  </head>
  <body>
    <div id="map"></div>
    <script type="module">
      import { BASEMAPS, beforeLabels, createViewer, mapkern } from "../viewer.js";

      const params = new URLSearchParams(location.search);
      const tiles = params.get("tiles") ?? "../../data/seattle.pmtiles";

      const { map } = createViewer({
        basemaps: [{ name: "Seattle", style: mapkern.lightStyle({ url: tiles, buildings: "flat" }) }, ...BASEMAPS],
        center: [-122.3375, 47.6105],
        zoom: 14.6,
        overlay(map) {
          if (map.getLayer("poi-heat")) return;
          const shared = map.getSource("osm")?.type === "vector";
          if (!shared && !map.getSource("places")) map.addSource("places", { type: "vector", url: tiles });
          map.addLayer(
            {
              id: "poi-heat",
              type: "heatmap",
              source: shared ? "osm" : "places",
              sourceLayer: "poi",
              maxZoom: 17,
              paint: {
                radius: ["interpolate", ["linear"], ["zoom"], 12, 6, 16, 22],
                intensity: ["interpolate", ["linear"], ["zoom"], 12, 0.15, 16, 0.45],
                opacity: ["interpolate", ["linear"], ["zoom"], 15, 0.9, 17, 0],
                weight: ["match", ["get", "class"], "shop", 1.5, "amenity", 1.2, 0.8],
              },
            },
            beforeLabels(map),
          );
        },
      });
      window.map = map;
    </script>
  </body>
</html>
