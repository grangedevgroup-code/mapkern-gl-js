<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Maplet</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #11191f;
      }
      #map {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script type="module">
      import * as maplet from "./dist/maplet.js";

      const map = new maplet.Map({ container: "map", hash: true });
      map.addControl(new maplet.NavigationControl());
      map.addControl(new maplet.ScaleControl(), "bottom-left");
      window.map = map;
    </script>
  </body>
</html>
