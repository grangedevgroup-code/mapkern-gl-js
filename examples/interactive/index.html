<!doctype html>
<html lang="en" class="maplet-viewer">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Click and hover</title>
    <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../viewer.css" />
  </head>
  <body>
    <div id="map"></div>
    <script type="module">
      import { BASEMAPS, createViewer, element, maplet } from "../viewer.js";

      const params = new URLSearchParams(location.search);
      const tiles = params.get("tiles") ?? "../../data/seattle.pmtiles";
      const buildings = ["building-3d", "building-3d-tall"];

      const { map, panel } = createViewer({
        basemaps: [{ name: "Seattle", style: maplet.lightStyle({ url: tiles }) }, ...BASEMAPS],
        center: [-122.3405, 47.6085],
        zoom: 15.5,
        pitch: 45,
        bearing: -20,
        overlay(map) {
          for (const id of buildings) {
            if (!map.getLayer(id)) continue;
            const color = map.getPaintProperty(id, "color") ?? "#e3dfd7";
            if (Array.isArray(color) && color[0] === "case") continue;
            map.setPaintProperty(id, "color", ["case", ["boolean", ["feature-state", "hover"], false], "#f2a541", color]);
          }
        },
      });
      window.map = map;

      const status = element("output", { textContent: " " });
      panel(
        element("h1", { textContent: "Click and hover" }),
        element("p", {
          textContent: "Hover over a building to light it up, click a park or a place for its name, and drag the red pin.",
        }),
        status,
      );

      let hovered;
      const setHover = (feature, on) => {
        if (feature?.id === undefined) return;
        map.setFeatureState({ source: feature.source, sourceLayer: feature.sourceLayer, id: feature.id }, { hover: on });
      };
      map.on("mousemove", buildings, (event) => {
        const feature = event.features[0];
        if (feature.id === hovered?.id && feature.source === hovered?.source) return;
        setHover(hovered, false);
        hovered = feature;
        setHover(hovered, true);
        const height = event.features[0].properties.height;
        status.textContent = height ? `Building, ${Math.round(height)} m tall` : "Building";
      });
      map.on("mouseleave", buildings, () => {
        setHover(hovered, false);
        hovered = undefined;
        status.textContent = " ";
      });

      const clickable = ["poi-dot", "park"];
      map.on("mouseenter", clickable, () => {
        map.getCanvas().style.cursor = "pointer";
      });
      map.on("mouseleave", clickable, () => {
        map.getCanvas().style.cursor = "";
      });
      map.on("click", clickable, (event) => {
        const feature = event.features[0];
        const name = feature.properties.name ?? (feature.layer === "park" ? "A park" : "A place");
        const content = element("div", {}, element("strong", { textContent: name }));
        if (feature.properties.class) {
          content.append(element("div", { textContent: feature.properties.subclass ?? feature.properties.class }));
        }
        new maplet.Popup().setLngLat(event.lngLat).setDOMContent(content).addTo(map);
      });

      const where = (lngLat) => `${lngLat[1].toFixed(5)}, ${lngLat[0].toFixed(5)}`;
      const pinPopup = new maplet.Popup({ offset: 4 }).setText("Drag me");
      const pin = new maplet.Marker({ color: "#d9473f", draggable: true })
        .setLngLat([-122.3421, 47.6097])
        .setPopup(pinPopup)
        .addTo(map);
      pin.on("dragend", () => {
        pinPopup.setText(`Dropped at ${where(pin.getLngLat())}`);
        if (!pinPopup.isOpen()) pin.togglePopup();
      });
    </script>
  </body>
</html>
