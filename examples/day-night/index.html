<!doctype html>
<html lang="en" class="maplet-viewer">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Day and night</title>
    <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../viewer.css" />
  </head>
  <body>
    <div id="map"></div>
    <script type="module">
      import { BASEMAPS, button, createViewer, element, row } from "../viewer.js";

      const params = new URLSearchParams(location.search);
      const imagery = params.get("imagery");
      const basemaps = imagery
        ? [
            {
              name: "Your imagery",
              style: {
                version: 1,
                sources: { imagery: { type: "raster", tiles: [imagery], tileSize: 256 } },
                layers: [{ id: "imagery", type: "raster", source: "imagery" }],
              },
            },
            ...BASEMAPS,
          ]
        : BASEMAPS;

      const date = element("input", { type: "date", ariaLabel: "Date" });
      const time = element("input", { type: "range", min: "0", max: "1439", step: "5", ariaLabel: "Time of day in UTC" });
      const label = element("output");
      let live = true;

      function show(ms) {
        const when = new Date(ms);
        date.value = when.toISOString().slice(0, 10);
        time.value = String(when.getUTCHours() * 60 + when.getUTCMinutes());
        const local = when.toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
        label.textContent = `${live ? "Now: " : ""}${local} your time, ${when.toISOString().slice(11, 16)} UTC`;
      }

      function apply(map) {
        if (live) {
          map.setSun({ time: "now" });
          show(Date.now());
          return;
        }
        const [y, m, d] = date.value.split("-").map(Number);
        const minutes = Number(time.value);
        const ms = Date.UTC(y, m - 1, d, Math.floor(minutes / 60), minutes % 60);
        map.setSun({ time: ms });
        show(ms);
      }

      const { map, panel } = createViewer({ basemaps, overlay: apply });
      panel(
        row(
          date,
          button("Now", () => {
            live = true;
            apply(map);
          }),
        ),
        time,
        label,
      );
      for (const input of [date, time]) {
        input.addEventListener("input", () => {
          live = false;
          apply(map);
        });
      }
      setInterval(() => {
        if (live) show(Date.now());
      }, 30000);
      window.map = map;
    </script>
  </body>
</html>
