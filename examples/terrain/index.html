<!doctype html>
<html lang="en" class="mapkern-viewer">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mapkern terrain</title>
    <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../viewer.css" />
  </head>
  <body>
    <div id="map"></div>
    <script type="module">
      import { BASEMAPS, createViewer, fileButton, mapkern, TERRAIN } from "../viewer.js";

      const params = new URLSearchParams(location.search);
      const tiles = params.get("tiles");
      const elevation = params.get("elevation");

      const { map, terrain, panel } = createViewer({
        basemaps: tiles ? [{ name: "Your tiles", style: mapkern.lightStyle({ url: tiles }) }, ...BASEMAPS] : BASEMAPS,
        terrain: elevation ? { type: "dem", url: elevation } : TERRAIN,
        view: "tilted",
        center: [-121.76, 46.85],
        zoom: 10.5,
      });
      map.on("error", (event) => console.warn(event.error.message));

      let fit = Boolean(elevation);
      map.on("sourcedata", (event) => {
        if (!fit || event.sourceId !== "mapkern-terrain" || event.kind !== "metadata") return;
        fit = false;
        const bounds = map.getSource("mapkern-terrain")?.bounds;
        if (bounds) map.fitBounds(bounds, { padding: 40, maxZoom: 11 });
      });

      panel(
        fileButton(
          "Open elevation files",
          ".pmtiles,.mbtiles,.dt0,.dt1,.dt2,.dt3,.hgt,.tif,.tiff,.zip",
          async (files) => {
            fit = true;
            const archive = files.length === 1 && /\.(pmtiles|mbtiles)$/i.test(files[0].name);
            const url = archive ? await mapkern.openTileFile(files[0]) : await mapkern.openElevationFile(files);
            terrain.setSource({ type: "dem", url });
            if (terrain.view === "flat") terrain.setView("tilted");
          },
          { multiple: true },
        ),
      );
      window.map = map;
    </script>
  </body>
</html>
