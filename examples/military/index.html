<!doctype html>
<html lang="en" class="maplet-viewer">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Military symbols</title>
    <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../viewer.css" />
  </head>
  <body>
    <div id="map"></div>
    <script type="module">
      import { createViewer, element, fileButton, maplet } from "../viewer.js";

      const now = new Date();
      const later = new Date(now.getTime() + 3600000);
      const event = (uid, type, lat, lon, callsign, extra = "") =>
        `<event version="2.0" uid="${uid}" type="${type}" how="h-g-i-g-o" time="${now.toISOString()}" start="${now.toISOString()}" stale="${later.toISOString()}"><point lat="${lat}" lon="${lon}" hae="0" ce="10" le="10"/><detail><contact callsign="${callsign}"/>${extra}</detail></event>`;
      const cot = `<events>${[
        event("u1", "a-f-G-U-C-I", 47.6205, -122.3493, "ALPHA", "<remarks>Holding the hill</remarks>"),
        event("u2", "a-f-G-U-C-A", 47.6097, -122.3331, "BRAVO"),
        event("u3", "a-f-G-U-C-F", 47.5952, -122.3316, "CHARLIE"),
        event("u4", "a-f-G-U-S-M", 47.6062, -122.3165, "DOC"),
        event("u5", "a-h-G-U-C-I", 47.6315, -122.3145, "RED 1"),
        event("u6", "a-h-G-U-C-A", 47.6421, -122.3359, "RED 2"),
        event("u7", "a-n-G-U-C-I", 47.5798, -122.3863, "BLUE WATER"),
        event("u8", "a-u-G", 47.6520, -122.3510, "UNKNOWN"),
        event("u9", "a-f-A-M-F-Q", 47.6, -122.4, "HAWK"),
        event(
          "route",
          "u-d-f",
          47.6097,
          -122.3331,
          "ROUTE GOLD",
          '<link point="47.6097,-122.3331"/><link point="47.6150,-122.3400"/><link point="47.6205,-122.3493"/><strokeColor value="-23296"/><strokeWeight value="4"/>',
        ),
        event("zone", "u-d-c-c", 47.6315, -122.3145, "WATCH", '<shape><ellipse major="600" minor="600" angle="0"/></shape><fillColor value="1442775040"/>'),
      ].join("")}</events>`;

      let data = URL.createObjectURL(new Blob([cot], { type: "application/xml" }));

      const { map, panel } = createViewer({
        center: [-122.345, 47.615],
        zoom: 12.5,
        overlay(map) {
          if (!map.getSource("units")) map.addSource("units", { type: "geojson", data });
          if (!map.getLayer("areas")) {
            map.addLayer({
              id: "areas",
              type: "fill",
              source: "units",
              filter: ["==", ["geometry-type"], "Polygon"],
              paint: { color: ["coalesce", ["get", "fill"], "#ff0000"], opacity: 0.25 },
            });
          }
          if (!map.getLayer("routes")) {
            map.addLayer({
              id: "routes",
              type: "line",
              source: "units",
              filter: ["==", ["geometry-type"], "LineString"],
              paint: {
                color: ["coalesce", ["get", "stroke"], "#ff9900"],
                width: ["coalesce", ["get", "stroke-width"], 3],
              },
            });
          }
          if (!map.getLayer("symbols")) {
            map.addLayer({
              id: "symbols",
              type: "symbol",
              source: "units",
              filter: ["has", "sidc"],
              layout: {
                icon: ["concat", "sidc:", ["get", "sidc"]],
                iconAllowOverlap: true,
                optional: true,
                text: ["get", "callsign"],
                offset: [0, 1.1],
                anchor: "top",
                size: 12,
                weight: "bold",
              },
              paint: { haloColor: "#ffffff", haloWidth: 1.5 },
            });
          }
        },
      });
      maplet.militarySymbols(map);

      map.on("click", "symbols", (e) => {
        const f = e.features?.[0];
        if (!f) return;
        const p = f.properties ?? {};
        const at = maplet.toMgrs(f.geometry.coordinates) ?? "";
        new maplet.Popup()
          .setLngLat(f.geometry.coordinates)
          .setText(`${p.callsign ?? p.uid}  ${p.type}  ${at}${p.remarks ? `\n${p.remarks}` : ""}`)
          .addTo(map);
      });

      const grid = element("output", { ariaLive: "polite" });
      panel(
        grid,
        fileButton("Open a file", "", (file) => {
          data = file;
          map.getSource("units")?.setData(file);
        }),
      );
      const show = () => {
        const text = maplet.toMgrs(map.getCenter(), 5);
        grid.textContent = text ? text.replace(/^(\d+\w)(\w\w)(\d{5})(\d{5})$/, "$1 $2 $3 $4") : "Outside MGRS";
      };
      map.on("move", show);
      show();
      window.map = map;
    </script>
  </body>
</html>
